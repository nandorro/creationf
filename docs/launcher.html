<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acceso</title>
<meta name="theme-color" content="#0f1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0f1220;--card:#181c30;--line:#2a3050;--tx:#eef0fa;--mu:#9aa1c4;--ac:#7b6cff;--ac2:#00b8d9}
@media (prefers-color-scheme:light){:root{--bg:#f2f4fb;--card:#fff;--line:#dfe3f2;--tx:#161a2e;--mu:#5d6488}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;text-align:center}
#ico svg{width:96px;height:96px;border-radius:24px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
h1{font-size:1.35rem;margin:14px 0 2px;word-break:break-word}
.u{color:var(--mu);font-size:.85rem;word-break:break-all;margin:0 0 16px}
button,a.b{display:block;width:100%;padding:14px;border-radius:14px;font:inherit;font-weight:700;border:0;cursor:pointer;text-decoration:none;margin-top:10px}
.p{color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.s{color:var(--tx);background:transparent;border:1px solid var(--line)}
.how{text-align:left;font-size:.88rem;color:var(--mu);margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.how b{color:var(--tx)}
.how p{margin:.4em 0}
</style>
</head>
<body>
<div class="card" id="c" hidden>
  <div id="ico"></div>
  <h1 id="nom"></h1>
  <p class="u" id="u"></p>
  <a class="b p" id="abrir" href="#">Abrir ahora</a>
  <button class="p" id="inst" hidden>Instalar acceso en este dispositivo</button>
  <button class="p" id="desk" hidden>Crear acceso directo en el escritorio</button>
  <a class="b s" href="index.html">Crear otro acceso</a>
  <div class="how" id="dhow"></div>
  <div class="how" id="how"></div>
</div>
<div class="card" id="bad" hidden><h1>Acceso no válido</h1><p class="u">Falta la URL o no es http/https.</p><a class="b p" href="index.html">Volver a Creationf</a></div>

<script src="icons.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  var u = q.get('u') || '', n = q.get('n') || '', i = parseInt(q.get('i'), 10);
  var ok = false;
  try { var uu = new URL(u); ok = uu.protocol === 'http:' || uu.protocol === 'https:'; } catch (e) {}
  if (!ok) { $('bad').hidden = false; return; }
  if (!(i >= 0 && i < ICONS.length)) i = 0;
  if (!n) n = uu.hostname.replace(/^www\./, '');
  var ic = ICONS[i];

  // Instalado y lanzado desde el icono: ir directamente a la URL
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  if (standalone && !q.get('stay')) { location.replace(u); return; }

  document.title = n;
  $('c').hidden = false;
  $('ico').innerHTML = iconSvg(ic);
  $('nom').textContent = n;
  $('u').textContent = u;
  $('abrir').href = u;

  // PNG del icono a partir del SVG (para manifest e icono de iOS)
  function png(size) {
    return new Promise(function (res) {
      var img = new Image();
      img.onload = function () {
        var c = document.createElement('canvas'); c.width = c.height = size;
        c.getContext('2d').drawImage(img, 0, 0, size, size);
        res(c.toDataURL('image/png'));
      };
      img.onerror = function () { res(null); };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg(ic, false));
    });
  }

  Promise.all([png(512), png(192), png(180)]).then(function (p) {
    if (!p[0]) return;
    var l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = p[2]; document.head.appendChild(l);
    var l2 = document.createElement('link'); l2.rel = 'icon'; l2.href = p[1]; document.head.appendChild(l2);
    var base = location.href.replace(/[^\/]*$/, '');
    var man = {
      id: location.pathname + location.search, name: n, short_name: n.slice(0, 12),
      start_url: location.pathname + location.search, scope: base.replace(location.origin, ''),
      display: 'standalone', background_color: ic.c2, theme_color: ic.c2,
      icons: [
        { src: p[1], sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
        { src: p[0], sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
      ]
    };
    var m = document.createElement('link'); m.rel = 'manifest';
    m.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/manifest+json' }));
    document.head.appendChild(m);
  });


  // ---- Acceso directo de escritorio (solo en PC) ----
  var movil = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!movil) {
    var so = /Win/i.test(navigator.platform) ? 'win' : /Mac/i.test(navigator.platform) ? 'mac' : 'lin';
    var seguro = n.replace(/[\\/:*?"<>|%'`$&^!]/g, '').trim() || 'Acceso';
    var b64 = function (t) { var by = new TextEncoder().encode(t), s = ''; by.forEach(function (c) { s += String.fromCharCode(c); }); return btoa(s); };
    var baja = function (nombre, tipo, datos) {
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([datos], { type: tipo })); a.download = nombre;
      document.body.appendChild(a); a.click(); a.remove();
    };
    // ICO (PNG dentro de ICO, 256x256) a partir del icono elegido
    var icoB64 = function () {
      return png(256).then(function (d) {
        if (!d) return null;
        var raw = atob(d.split(',')[1]), png8 = new Uint8Array(raw.length);
        for (var k = 0; k < raw.length; k++) png8[k] = raw.charCodeAt(k);
        var h = new Uint8Array(22), v = new DataView(h.buffer);
        v.setUint16(2, 1, true); v.setUint16(4, 1, true);          // tipo ICO, 1 imagen
        h[6] = 0; h[7] = 0;                                        // 256x256
        v.setUint16(10, 1, true); v.setUint16(12, 32, true);
        v.setUint32(14, png8.length, true); v.setUint32(18, 22, true);
        var all = new Uint8Array(22 + png8.length); all.set(h); all.set(png8, 22);
        var s = ''; for (var k = 0; k < all.length; k++) s += String.fromCharCode(all[k]);
        return btoa(s);
      });
    };
    var hint = '';
    $('desk').hidden = false;
    if (so !== 'win') $('desk').textContent = so === 'mac' ? 'Descargar acceso directo (.webloc)' : 'Descargar acceso directo (.desktop)';
    $('desk').onclick = function () {
      if (so === 'win') {
        icoB64().then(function (ico) {
          var ps = "$l=Get-Content -LiteralPath '%~f0'; function G($k){ $x=($l|Where-Object{$_ -like ('::'+$k+' *')}) -replace ('^::'+$k+' '),''; [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($x -join ''))) }; " +
            "$n=G 'N'; $u=G 'U'; $d=Join-Path $env:APPDATA 'Creationf'; New-Item -ItemType Directory -Force $d|Out-Null; $ico=Join-Path $d ($n+'.ico'); " +
            "$x=($l|Where-Object{$_ -like '::I *'}) -replace '^::I ',''; if($x){[IO.File]::WriteAllBytes($ico,[Convert]::FromBase64String(($x -join '')))}; " +
            "$f=Join-Path ([Environment]::GetFolderPath('Desktop')) ($n+'.url'); " +
            "$t='[InternetShortcut]'+[char]13+[char]10+'URL='+$u+[char]13+[char]10; if($x){$t+='IconFile='+$ico+[char]13+[char]10+'IconIndex=0'+[char]13+[char]10}; " +
            "[IO.File]::WriteAllText($f,$t,[Text.Encoding]::Default)";
          var bat = ['@echo off', 'powershell -NoProfile -ExecutionPolicy Bypass -Command "' + ps + '"',
            'echo Acceso "' + seguro + '" creado en el escritorio.', 'timeout /t 3 >nul', 'exit /b',
            '::N ' + b64(seguro), '::U ' + b64(u), ico ? '::I ' + ico : ''].join('
') + '
';
          baja('Crear acceso - ' + seguro + '.bat', 'application/octet-stream', bat);
          $('dhow').innerHTML = '<p><b>Abre el archivo descargado</b> (.bat) y el acceso aparecerá en tu escritorio con el icono elegido. Si Windows avisa: <b>Más información → Ejecutar de todos modos</b>. Después puedes borrar el .bat.</p>';
        });
      } else if (so === 'mac') {
        baja(seguro + '.webloc', 'application/xml', '<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0"><dict><key>URL</key><string>' + u.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</string></dict></plist>
');
        $('dhow').innerHTML = '<p><b>Arrastra el archivo .webloc</b> al escritorio. (En Mac no puede llevar el icono elegido; para eso, instala el acceso con Chrome o Safari: Archivo → Añadir al Dock.)</p>';
      } else {
        baja(seguro + '.desktop', 'application/x-desktop', '[Desktop Entry]
Type=Link
Name=' + seguro + '
URL=' + u + '
');
        $('dhow').innerHTML = '<p><b>Mueve el archivo .desktop</b> al escritorio y márcalo como «permitir ejecutar».</p>';
      }
    };
  }

  var ev = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); ev = e; $('inst').hidden = false; });
  $('inst').onclick = function () { if (ev) { ev.prompt(); ev = null; $('inst').hidden = true; } };
  window.addEventListener('appinstalled', function () { $('how').innerHTML = '<p><b>¡Instalado!</b> Búscalo en la pantalla de inicio y en tus aplicaciones.</p>'; });

  var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  $('how').innerHTML = ios
    ? '<p><b>En iPhone/iPad:</b> toca <b>Compartir</b> (cuadrado con flecha) → <b>Añadir a pantalla de inicio</b>. Se creará con este nombre e icono.</p>'
    : '<p><b>En Android (Chrome):</b> pulsa «Instalar acceso» o el menú <b>⋮ → Instalar aplicación / Añadir a pantalla de inicio</b>. Aparecerá en inicio y en el cajón de aplicaciones.</p><p>Si prefieres algo 100 % nativo, usa el <b>APK</b> de Creationf.</p>';
})();
</script>
</body>
</html>
